[project]
name = "derich-2027"
version = "0.1.0"
description = "DERICH YOLO Auto-Training Studio (WebSocket Web App) — Python 3.11.6 + CUDA 11.8"
readme = "README.md"
requires-python = ">=3.11.6,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "ultralytics>=8.4.0",
    "opencv-python!=4.13.0.90,>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.1",
    "psutil>=5.9.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
export = [
    "onnx>=1.16.0",
    "onnxslim>=0.1.34",
    "onnxruntime>=1.19.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu118", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
